apiVersion: v1
kind: Secret
metadata:
  name: urumi-postgres-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ required "Set postgres.password securely before deployment" .Values.postgres.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: urumi-woocommerce-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  WOOCOMMERCE_URL: {{ required "Set woocommerce.url before deployment" .Values.woocommerce.url | quote }}
  WOOCOMMERCE_CONSUMER_KEY: {{ required "Set woocommerce.consumerKey securely before deployment" .Values.woocommerce.consumerKey | quote }}
  WOOCOMMERCE_CONSUMER_SECRET: {{ required "Set woocommerce.consumerSecret securely before deployment" .Values.woocommerce.consumerSecret | quote }}

{{- $tls := .Values.ingress.tls.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: urumi-dashboard
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if eq .Values.ingress.className "nginx" }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  {{- end }}
  {{- if $tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.dashboardHost }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.dashboardHost }}
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: urumi-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: urumi-frontend
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: urumi-api
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if $tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.apiHost }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.apiHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: urumi-backend
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: urumi-store
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if $tls }}
  tls:
    - hosts:
        - {{ .Values.wordpress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.wordpress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: urumi-wordpress
                port:
                  name: http

apiVersion: v1
kind: Secret
metadata:
  name: urumi-mariadb-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  MARIADB_DATABASE: {{ .Values.mariadb.database | quote }}
  MARIADB_USER: {{ .Values.mariadb.username | quote }}
  MARIADB_PASSWORD: {{ required "Set mariadb.password securely before deployment" .Values.mariadb.password | quote }}
  MARIADB_ROOT_PASSWORD: {{ required "Set mariadb.rootPassword securely before deployment" .Values.mariadb.rootPassword | quote }}

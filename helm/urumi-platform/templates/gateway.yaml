apiVersion: apps/v1
kind: Deployment
metadata:
  name: urumi-gateway
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app: urumi-gateway
  template:
    metadata:
      labels:
        app: urumi-gateway
    spec:
      containers:
        - name: gateway
          image: {{ .Values.gateway.image }}
          imagePullPolicy: {{ .Values.gateway.imagePullPolicy }}
          command:
            - sh
            - -c
            - >-
              until python -m backend.gateway.bootstrap; do sleep 3; done;
              exec python -m backend.gateway.aggregator
          ports:
            - name: mcp
              containerPort: 8003
          env:
            - name: POSTGRES_HOST
              value: urumi-postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: urumi-postgres-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: urumi-postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: urumi-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: BOOTSTRAP_UPSTREAMS
              value: analytics=http://urumi-analytics:8002/mcp,time=http://urumi-time-tools:8001/mcp,woocommerce=http://urumi-woocommerce:8004/mcp
            - name: GATEWAY_HOST
              value: 0.0.0.0
          readinessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: urumi-gateway
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: urumi-gateway
  ports:
    - name: mcp
      port: {{ .Values.gateway.port }}
      targetPort: mcp

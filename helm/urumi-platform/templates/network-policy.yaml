apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: urumi-mcp-only-from-gateway
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - urumi-analytics
          - urumi-time-tools
          - urumi-woocommerce
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: urumi-gateway
      ports:
        - protocol: TCP
          port: 8001
        - protocol: TCP
          port: 8002
        - protocol: TCP
          port: 8004
